// 12. تنظیمات GitHub Actions (دانلود دقیق با jq + نمایش لاگ کامل خطا)
    $files['.github/workflows/build.yml'] = implode("\n", [
        'name: Build and Release Signed APK',
        '',
        'on:',
        '  push:',
        '    branches: [ "main" ]',
        '    tags:',
        '      - "v*"',
        '  workflow_dispatch:',
        '',
        'jobs:',
        '  build:',
        '    runs-on: ubuntu-22.04',
        '    permissions:',
        '      contents: write',
        '    steps:',
        '      - uses: actions/checkout@v4',
        '      - name: Set up JDK 17',
        '        uses: actions/setup-java@v5',
        '        with:',
        '          distribution: "temurin"',
        '          java-version: "17"',
        '      - name: Download Official Xray Core and Tun2Socks',
        '        run: |',
        '          set -e',
        '          mkdir -p app/libs app/src/main/jniLibs/arm64-v8a app/src/main/jniLibs/armeabi-v7a',
        '          AAR_URL=$(curl -s https://api.github.com/repos/2dust/AndroidLibXrayLite/releases/latest | jq -r \'.assets[] | select(.name | endswith(".aar")) | .browser_download_url\' | head -n 1)',
        '          echo "AAR_URL=$AAR_URL"',
        '          test -n "$AAR_URL"',
        '          curl -fL "$AAR_URL" -o app/libs/libv2ray.aar',
        '          T2S_ARM64=$(curl -s https://api.github.com/repos/xjasonlyu/tun2socks/releases/latest | jq -r \'.assets[] | select(.name | test("android-arm64\\\\.zip$")) | .browser_download_url\' | head -n 1)',
        '          echo "T2S_ARM64=$T2S_ARM64"',
        '          test -n "$T2S_ARM64"',
        '          curl -fL "$T2S_ARM64" -o t2s64.zip && unzip -o t2s64.zip -d t2s64 && mv t2s64/tun2socks* app/src/main/jniLibs/arm64-v8a/libtun2socks.so',
        '          T2S_ARM32=$(curl -s https://api.github.com/repos/xjasonlyu/tun2socks/releases/latest | jq -r \'.assets[] | select(.name | test("android-armv7\\\\.zip$")) | .browser_download_url\' | head -n 1)',
        '          echo "T2S_ARM32=$T2S_ARM32"',
        '          test -n "$T2S_ARM32"',
        '          curl -fL "$T2S_ARM32" -o t2s32.zip && unzip -o t2s32.zip -d t2s32 && mv t2s32/tun2socks* app/src/main/jniLibs/armeabi-v7a/libtun2socks.so',
        '          chmod +x app/src/main/jniLibs/arm64-v8a/libtun2socks.so app/src/main/jniLibs/armeabi-v7a/libtun2socks.so',
        '      - name: Generate Release Keystore',
        '        run: keytool -genkey -v -keystore app/release.keystore -alias avangkey -keyalg RSA -keysize 2048 -validity 10000 -storepass avangvpnpass -keypass avangvpnpass -dname "CN=AvangVPN, OU=Dev, O=Avang, L=Tehran, ST=Tehran, C=IR"',
        '      - name: Setup Gradle',
        '        uses: gradle/actions/setup-gradle@v4',
        '        with:',
        '          gradle-version: "8.5"',
        '      - name: Build Signed Release APK',
        '        run: gradle assembleRelease --stacktrace',
        '      - name: Rename APK',
        '        run: cp app/build/outputs/apk/release/app-release.apk Avang-VPN-Release.apk',
        '      - name: Upload APK Artifact',
        '        uses: actions/upload-artifact@v4',
        '        with:',
        '          name: Avang-VPN-Release-APK',
        '          path: Avang-VPN-Release.apk',
        '      - name: Publish GitHub Release',
        '        if: startsWith(github.ref, \'refs/tags/\')',
        '        uses: softprops/action-gh-release@v2',
        '        with:',
        '          files: Avang-VPN-Release.apk',
        '          name: Avang VPN ${{ github.ref_name }}',
        '          body: "Signed Release APK with Real Xray Core & Tun2Socks"',
        '          draft: false',
        '          prerelease: false',
    ]);
